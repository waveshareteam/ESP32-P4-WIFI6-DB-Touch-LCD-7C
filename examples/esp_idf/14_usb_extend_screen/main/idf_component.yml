version: 0.2.0
targets:
- esp32p4
dependencies:
  idf: '>=5.3'
  espressif/tinyusb: '*'
  esp32_p4_wifi6_db_touch_lcd_7c:
    override_path: ../../../../firmware/esp32_p4_wifi6_db_touch_lcd_7c
    rules:
    - if: target in [esp32p4]
  bsp_extra:
    rules:
    - if: target in [esp32s3]
    override_path: ../common_components/bsp_extra
  espressif/esp_new_jpeg:
    version: ^1.0.1
    rules:
    - if: target in [esp32s3]
