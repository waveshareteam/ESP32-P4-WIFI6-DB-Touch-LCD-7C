peripherals:
  - name: i2s_audio_in
    type: i2s
    format: tdm-in
    role: master
    config:
      port: 1
      sample_rate_hz: 48000
      clk_src: "I2S_CLK_SRC_DEFAULT"
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: "I2S_SLOT_MODE_STEREO"
      ws_width: 16
      total_slot: 4
      slot_mask: I2S_TDM_SLOT0 | I2S_TDM_SLOT1 | I2S_TDM_SLOT2 | I2S_TDM_SLOT3
      pins:
        mclk: 13
        bclk: 12
        ws: 10
        dout: 9
        din: 11

devices:
  - name: audio_dac
    config:
      dac_enabled: true
      dac_cfg:
        ref_enable: true
  - name: audio_adc
    config:
      dac_cfg:
        ref_enable: true
      adc_cfg:
        label: [FL, RE, FR, NA]
